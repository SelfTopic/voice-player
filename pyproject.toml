[project]
name = "voice-player"
version = "1.0.0"
description = "Голосовое управление плеерами и окнами KDE"
requires-python = ">=3.11"
dependencies = ["vosk"]

[project.optional-dependencies]
ask = ["faster-whisper", "yt-dlp", "numpy"]
telegram = ["pyrogram", "tgcrypto"]
dev = ["pytest", "ruff"]

[project.scripts]
voice-player = "voice_player.cli:main"
voice-player-telegram-sync = "voice_player.telegram.catalog:main"
voice-player-check-word = "voice_player.check_words:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice_player*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
